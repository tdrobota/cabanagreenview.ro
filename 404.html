<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagină negăsită – Green View Rarău</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#141E0A">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #141E0A;
      color: #F5F0E8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 30rem; }
    .mark { width: 64px; height: 64px; margin: 0 auto 1.5rem; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 2rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: rgba(245,240,232,0.75); line-height: 1.6; margin-bottom: 1.75rem; }
    a.home {
      display: inline-block;
      padding: 0.8rem 1.8rem;
      background: #B07828;
      color: #F5F0E8;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    a.home:hover { background: #C49040; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#1C2A10"/>
      <path d="M32 12 54 50 H10 Z" fill="none" stroke="#B07828" stroke-width="5" stroke-linejoin="round"/>
      <path d="M32 26 42 44 H22 Z" fill="#B07828"/>
      <rect x="29" y="37" width="6" height="7" fill="#141E0A"/>
    </svg>
    <h1>Pagina nu există</h1>
    <p>Se pare că linkul este greșit sau pagina a fost mutată. Hai înapoi la cabană.</p>
    <a class="home" href="/">Pagina principală</a>
  </div>
</body>
</html>
