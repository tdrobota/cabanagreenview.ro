<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagină negăsită – Green View Rarău</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <meta name="theme-color" content="#0d1a1e">
  <link rel="stylesheet" href="/fonts.css?v=2">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #0d1a1e;
      color: #f2f6f6;
      font-family: 'Host Grotesk', system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 30rem; }
    .mark { width: 64px; height: 64px; margin: 0 auto 1.5rem; }
    h1 { font-size: 2.6rem; font-weight: 400; letter-spacing: -0.035em; line-height: 1.05; margin-bottom: 0.75rem; }
    p { color: #93b2b8; line-height: 1.6; margin-bottom: 1.75rem; }
    a.home {
      display: inline-block;
      padding: 0.8rem 1.8rem;
      background: #f2f6f6;
      color: #0d1a1e;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -0.005em;
    }
    a.home:hover { background: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="#f2f6f6" stroke-width="4.2" stroke-linecap="round"><path d="M11 52 37.1 5"/><path d="M53 52 26.9 5"/><path d="M20.5 36h23"/></g>
      <rect x="27.5" y="41" width="9" height="11" rx="1.2" fill="#e9a23b"/>
    </svg>
    <h1>Pagina nu există</h1>
    <p>Se pare că linkul este greșit sau pagina a fost mutată. Hai înapoi la cabană.</p>
    <a class="home" href="/">Pagina principală</a>
  </div>
</body>
</html>
